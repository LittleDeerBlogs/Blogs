project:
  type: website
  output-dir: docs

website:
  title: "LittleDeerBlogs"
  site-url: https://littledeerblogs.github.io/Blogs/
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About

format:
  html:
    theme:
      - darkly
      - custom.scss
    toc: true
    toc-depth: 3
    code-fold: false
    code-tools: true
    code-overflow: wrap
    code-line-numbers: false
    highlight-style: github-dark
    fig-align: center
    embed-resources: true
    smooth-scroll: true
    link-external-newwindow: true